[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-metrics-id"
version = "0.1.0"
description = "Metrik lokal untuk evaluasi ranking retrieval RAG"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rag-metrics-id contributors" }]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
rag-metrics-id = "rag_metrics_id.core:main"

[tool.setuptools.packages.find]
where = ["src"]
